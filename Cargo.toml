[package]
name = "ad-access"
# First stable release. The evaluator (ordered DACL, deny-before-allow, owner
# rights, generic mapping, conditional-ACE evaluator, mandatory integrity,
# inheritance flags, object-type ACEs) is validated 42/42 against Windows
# AuthzAccessCheck / AuthzAccessCheckByType. SDDL-string conditional parsing +
# RESTRICTED tokens are documented non-goals (see lib.rs).
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["zevs"]
description = "Windows effective-access / token evaluator: given a security descriptor and a token, compute resultant access (ordered DACL, deny-before-allow, owner rights, generic mapping, conditional ACEs, mandatory integrity, inheritance flags, object-type ACEs). Validated 42/42 against Windows AuthzAccessCheck. Zero dependencies."
keywords = ["access-control", "acl", "security", "windows", "active-directory"]
categories = ["authentication"]
readme = "README.md"
repository = "https://github.com/icedracon/ad-access"

[dependencies]
# none — pure logic over parsed SD/token structures. SDDL/token parsing is a
# caller concern (e.g. the in-house `windows-sddl` / `ad-acl` crates).
